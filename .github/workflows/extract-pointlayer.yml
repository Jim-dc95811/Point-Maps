name: Extract PointLayer source

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact v1.3 source from release ZIP
        shell: bash
        run: |
          if [ -f PointLayer.py ]; then
            echo "PointLayer.py already exists; nothing to do."
            exit 0
          fi
          unzip -p releases/PointLayer_v1.3.zip PointLayer.py > PointLayer.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PointLayer.py
          git commit -m "Add PointLayer v1.3 source"
          git push
